<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>President | Ram Joshua Magsaysay Bautista</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", sans-serif;
}

body{
    background:#efefef;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px 15px;
}

.phone-frame{
    width:360px;
    background:#f8f8f8;
    border:12px solid #111;
    border-radius:42px;
    padding:28px 18px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.profile{
    text-align:center;
    margin-bottom:20px;
}

.profile img{
    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #ddd;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:18px;
    text-align:center;
}

.role{
    font-size:12px;
    letter-spacing:2px;
    color:#666;
    text-transform:uppercase;
    margin-bottom:8px;
}

.card h2{
    color:#111;
    font-size:26px;
    line-height:1.2;
    margin-bottom:14px;
}

.card p{
    color:#555;
    font-size:14px;
    line-height:1.8;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    background:#8d3c88;
    color:white;
    text-decoration:none;
    padding:12px 30px;
    border-radius:30px;
    font-weight:500;
    transition:.3s;
}

.btn:hover{
    background:#6d2d69;
}

.icons{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:20px;
}

.icons a{
    color:#8d3c88;
    font-size:20px;
    transition:.3s;
}

.icons a:hover{
    transform:scale(1.15);
}

.info{
    margin-top:12px;
}

.info-box{
    display:flex;
    align-items:center;
    gap:14px;
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:14px;
    margin-bottom:10px;
}

.icon{
    width:42px;
    height:42px;
    background:#f4e9f3;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8d3c88;
    font-size:20px;
}

.label{
    font-size:12px;
    color:#666;
}

.value{
    font-size:15px;
    color:#111;
    word-break:break-word;
}

@media(max-width:420px){
    .phone-frame{
        width:100%;
        border-width:8px;
        border-radius:30px;
    }

    .card h2{
        font-size:22px;
    }
}
</style>
</head>
<body>

<div class="phone-frame">

    <div class="profile">
        <img src="./images/president.jpg" alt="Ram Joshua Magsaysay Bautista">
    </div>

    <div class="card">

        <div class="role">President</div>

        <h2>Ram Joshua Magsaysay Bautista</h2>

        <p>
            A distinguised leader in the business community with extensive connections among political leaders and various government agencies.
        </p>

        <a href="#contact" class="btn">Add Contact</a>

        <div class="icons">
            <a href="tel:+639177267262"><i class="fa-solid fa-phone"></i></a>
            <a href="mailto:ram.bautista@lbbssc.agency">
                <i class="fa-regular fa-envelope"></i>
            </a>
        </div>

    </div>

    <div class="info" id="contact">

        <div class="info-box">
            <div class="icon">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <div>
                <div class="label">Mobile Phone</div>
                <div class="value">+63 917 726 7262</div>
            </div>
        </div>

        <div class="info-box">
            <div class="icon">
                <i class="fa-regular fa-envelope"></i>
            </div>
            <div>
                <div class="label">Email</div>
                <div class="value">ram.bautista@lbbssc.agency</div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
